{% extends "base_auth.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="w-full max-w-md">
    <div class="glass-panel w-full p-8 md:p-10 shadow-lg">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-3">
                <span class="material-symbols-outlined text-primary-400 text-3xl">inventory_2</span>
            </div>
            <h1 class="text-2xl font-light text-canvas-100 tracking-tight mb-1">
                Suministros <span class="text-canvas-400">CNCV</span>
            </h1>
            <p class="text-canvas-500 text-sm">Accede a tu cuenta para continuar.</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="post" class="space-y-6">
            {{ form.hidden_tag() }}

            <div class="space-y-2">
                <label for="usuario" class="block text-sm font-medium text-canvas-300">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-canvas-500">
                        <span class="material-symbols-outlined text-xl">person</span>
                    </span>
                    <input type="text" name="usuario" id="usuario"
                        class="form-input pl-10 focus:border-primary-500 focus:ring-primary-500" placeholder="Ej. admin"
                        autofocus autocomplete="off">
                </div>
            </div>

            <div class="space-y-2">
                <label for="contrasenya" class="block text-sm font-medium text-canvas-300">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-canvas-500">
                        <span class="material-symbols-outlined text-xl">lock</span>
                    </span>
                    <input type="password" name="contrasenya" id="contrasenya"
                        class="form-input pl-10 focus:border-primary-500 focus:ring-primary-500" placeholder="••••••••"
                        autocomplete="off">
                </div>
            </div>

            <div class="pt-2">
                <button
                    class="w-full btn-elegant btn-primary justify-center py-2.5"
                    type="submit">
                    Iniciar sesión
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-sm">
            <p class="text-canvas-500">¿No tienes cuenta?</p>
            <a href="{{ url_for('auth.registro') }}"
                class="text-primary-400 hover:text-primary-300 font-medium transition-colors">
                Regístrate aquí
            </a>
        </div>
    </div>
</div>
{% endblock %}
